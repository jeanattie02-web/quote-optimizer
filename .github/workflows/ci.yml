name: Python CI, Lint & Docker Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest black flake8

    - name: Verification du style avec Flake8
      run: |
        flake8 . --max-line-length=88 --exclude=venv,.git,__pycache__

    - name: Lancement des tests unitaires
      run: |
        pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Vérification du Build Docker
      run: |
        docker build -t quote-optimizer:latest .